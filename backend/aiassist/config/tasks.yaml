research_task:
  description: >
    {topic}에 대해 최신 정보와 동향을 철저하게 연구하여 가장 중요한 요소를 찾아내세요.
    {current_date} 현재를 기준으로, {topic}에 대한 신뢰할 수 있는 출처에서만 최신 정보를 가져오세요.

    작업 절차:
    - 먼저 {topic}을 6~10개의 서로 다른 관점의 검색 쿼리로 확장(영문 우선: 동의어/약어/제조사/경쟁사/지표명 포함, 한글은 보조로 1~2개만)
    - 각 쿼리마다 웹 검색 도구를 호출하여 결과를 수집
    - 결과를 통합/중복 제거 후, 신뢰할 수 있는 매체/공식 문서 위주로만 선별
    - 상위 검색 결과가 커뮤니티/포럼/질문답변 위주일 경우(예: Apple Communities, Reddit, Quora 등), 해당 도메인을 `-site:`로 제외하여 쿼리를 재작성하고 즉시 재검색할 것
    - 재작성 시 산업/금융 키워드(earnings, guidance, ASP, shipment, inventory, capex, forecast, TAM 등)와 권위 출처 타겟팅(site:reuters.com, site:ft.com, site:wsj.com, 기업 IR/SEC 등)을 포함할 것
    - 핵심 주장(사실/수치/전망/이벤트)마다 출처 링크를 1개 이상 붙임
    - 검색 결과가 충분하지 않으면 임의로 보완하지 말고 "검색 결과 부족"이라고 명시
    - 검색 도구 호출 횟수와 사용한 쿼리 수를 최종 결과에 반드시 보고

  expected_output: >
    1. 사용한 검색 쿼리 목록(6~10개, 영문 우선)과 각 쿼리별 핵심 발견 1~2줄
    2. 신뢰할 수 있는 금융/경제 뉴스 및 리서치/공식 문서 기반 최신 트렌드 요약
    3. {topic}에 대한 10가지 주요 사항(각 항목별 출처 링크 1개 이상)
    4. 서로 상충되는 관측이 있으면 양쪽 출처를 함께 제시하고, 불확실성/가정은 명확히 표시
    5. 검색 도구 호출 횟수 요약 및 검색 결과 부족 여부 명시

  agent: researcher

reporting_task:
  description: >
    받은 자료를 검토하고 각 주제를 리포트의 전체 섹션으로 확장하세요.
    리포트는 상세하고 관련된 모든 정보를 포함해야 하며, 마크다운 형식으로 작성되어야 합니다.
    {current_date} 기준 최신 시장 트렌드를 포함해야 합니다.

    (주의) 리포트 작성 시 research_task에서 제공한 출처 링크를 보존하고, 각 섹션의 핵심 주장마다 출처를 다시 연결하세요.
    (중요) research_task 결과에 포함되지 않은 사실·수치·전망은 절대 추가하지 마세요.

  expected_output: >
    0. 한글로 작성할 것
    1. research_task에서 검증된 10가지 주요 사항만 사용하여 리포트 구성
    2. 각 항목마다 출처 링크를 각주 또는 인라인으로 명시
    3. 추정·의견은 별도 섹션으로 분리하여 명확히 표시
    4. 출처가 없는 문장은 포함하지 않음

  agent: reporting_analyst
