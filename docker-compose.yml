version: '3.9'

services:
  react:
    container_name: react
    build:
      context: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    environment:
      - VITE_DEV_SERVER_HMR_HOST=host.docker.internal
      - VITE_DEV_SERVER_HMR_PORT=3000
      - CHOKIDAR_USEPOLLING=false
      - NODE_ENV=development
    command: >
      sh -c "test -d node_modules || yarn install && yarn vite --host 0.0.0.0 --port 3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  django:
    container_name: django
    build:
      context: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:delegated
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=TradeVortex.settings
      - CELERY_BROKER_URL=redis://redis:6379/0  # Redis 연결
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_AUTO_MAKEMIGRATIONS=0
      - DJANGO_COLLECTSTATIC=0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:4b-instruct-2507-q4_K_M
      - OLLAMA_TEMPERATURE=0.2
    depends_on:
      - redis
      - postgres
    command: >
      sh -c "
      if [ \"${DJANGO_AUTO_MAKEMIGRATIONS:-0}\" = \"1\" ]; then python manage.py makemigrations; fi &&
      python manage.py migrate --noinput &&
      if [ \"${DJANGO_COLLECTSTATIC:-0}\" = \"1\" ]; then python manage.py collectstatic --noinput; fi &&
      gunicorn -k uvicorn.workers.UvicornWorker TradeVortex.asgi:application --bind 0.0.0.0:8000 --workers 4 --reload
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:latest
    container_name: redis
    cpus: "0.5"
    mem_limit: "256m"
    restart: always
    volumes:
      - redis_volume_data:/data
    ports:
      - 6379:6379

  redis-insight:
    image: redis/redisinsight
    container_name: redis_insight
    restart: always
    ports:
      - 5540:5540
    volumes:
      - redis_insight_volume_data:/db

  celery:
    container_name: celery
    build:
      context: backend
    command: celery -A TradeVortex worker --loglevel=info
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0  # Redis 연결
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:4b-instruct-2507-q4_K_M
      - OLLAMA_TEMPERATURE=0.2
    volumes:
      - ./backend:/app:delegated
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json

  nginx:
    container_name: nginx
    cpus: "0.5"
    mem_limit: "256m"
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/build:/usr/share/nginx/html
    ports:
      - "80:80"
    depends_on:
      - react
      - django

  postgres:
    image: postgres:15
    container_name: postgres
    cpus: "1.0"
    mem_limit: "2048m"
    restart: always
    environment:
      POSTGRES_DB: tradevortex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_volume_data:
  pgadmin_data:
  redis_insight_volume_data:
  postgres_data:
